name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: wsl-fix-filesystem
          path: ./artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifact/wsl-fix-filesystem.zip
